#VRML_SIM R2025a utf8
# template language: javascript

PROTO SlopeTerrain [
  field SFFloat angle 0
  field SFVec3f size 4 0.1 4
  field SFVec3f translation 0 -0.05 0
] {
  Solid {
    translation IS translation
    rotation 0 0 1 %<= fields.angle.value * 0.01745329252 >%
    contactMaterial "ground"
    children [
      Shape {
        appearance PBRAppearance {
          baseColor 0.35 0.40 0.34
          roughness 0.9
        }
        geometry Box { size IS size }
      }
    ]
    boundingObject Box { size IS size }
    # Static/dynamic foot friction estimates are 0.8/0.6. Webots exposes the
    # Coulomb coefficient here; the dynamic estimate remains a calibration note.
    physics NULL
  }
}
