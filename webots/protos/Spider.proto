#VRML_SIM R2025a utf8

EXTERNPROTO "SpiderLeg.proto"

PROTO Spider [
  field SFVec3f translation 0 0.133 0
  field SFRotation rotation 0 0 1 0
  field SFString controller "spider_controller"
  field SFString customData ""
  field SFString name "spider"
  field SFBool supervisor TRUE
  # Provisional values: replace after measured mass/inertia and actuator limits.
  field SFFloat bodyMass 1.2
  field SFFloat linkMass 0.1
  field SFFloat jointTorque 2.5
] {
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    customData IS customData
    supervisor IS supervisor
    children [
      Transform {
        translation 0 -0.014 0
        rotation 1 0 0 -1.570796
        scale 0.001 0.001 0.001
        children [
          Shape {
            castShadows FALSE
            appearance PBRAppearance {
              baseColor 0.22 0.24 0.28
              roughness 0.55
              metalness 0.25
            }
            geometry Mesh { url [ "../assets/body_hex_base.stl" ] }
          }
        ]
      }
      SpiderLeg {
        coxaMotorName "legi_coxa_motor"
        coxaSensorName "legi_coxa_sensor"
        femurMotorName "legi_femur_motor"
        femurSensorName "legi_femur_sensor"
        tibiaMotorName "legi_tibia_motor"
        tibiaSensorName "legi_tibia_sensor"
        translation 0.05 0 0
        rotation 0 1 0 0
        jointTorque IS jointTorque
        linkMass IS linkMass
      }
      SpiderLeg {
        coxaMotorName "legj_coxa_motor"
        coxaSensorName "legj_coxa_sensor"
        femurMotorName "legj_femur_motor"
        femurSensorName "legj_femur_sensor"
        tibiaMotorName "legj_tibia_motor"
        tibiaSensorName "legj_tibia_sensor"
        translation 0.05 0 0.04
        rotation 0 1 0 -0.785398
        jointTorque IS jointTorque
        linkMass IS linkMass
      }
      SpiderLeg {
        coxaMotorName "legk_coxa_motor"
        coxaSensorName "legk_coxa_sensor"
        femurMotorName "legk_femur_motor"
        femurSensorName "legk_femur_sensor"
        tibiaMotorName "legk_tibia_motor"
        tibiaSensorName "legk_tibia_sensor"
        translation -0.05 0 0.04
        rotation 0 1 0 -2.356194
        jointTorque IS jointTorque
        linkMass IS linkMass
      }
      SpiderLeg {
        coxaMotorName "legl_coxa_motor"
        coxaSensorName "legl_coxa_sensor"
        femurMotorName "legl_femur_motor"
        femurSensorName "legl_femur_sensor"
        tibiaMotorName "legl_tibia_motor"
        tibiaSensorName "legl_tibia_sensor"
        translation -0.05 0 0
        rotation 0 1 0 3.141593
        jointTorque IS jointTorque
        linkMass IS linkMass
      }
      SpiderLeg {
        coxaMotorName "legm_coxa_motor"
        coxaSensorName "legm_coxa_sensor"
        femurMotorName "legm_femur_motor"
        femurSensorName "legm_femur_sensor"
        tibiaMotorName "legm_tibia_motor"
        tibiaSensorName "legm_tibia_sensor"
        translation -0.05 0 -0.04
        rotation 0 1 0 2.356194
        jointTorque IS jointTorque
        linkMass IS linkMass
      }
      SpiderLeg {
        coxaMotorName "legn_coxa_motor"
        coxaSensorName "legn_coxa_sensor"
        femurMotorName "legn_femur_motor"
        femurSensorName "legn_femur_sensor"
        tibiaMotorName "legn_tibia_motor"
        tibiaSensorName "legn_tibia_sensor"
        translation 0.05 0 -0.04
        rotation 0 1 0 0.785398
        jointTorque IS jointTorque
        linkMass IS linkMass
      }
    ]
    boundingObject Box { size 0.24 0.04 0.22 }
    physics Physics { density -1 mass IS bodyMass }
  }
}
