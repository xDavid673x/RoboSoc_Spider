#VRML_SIM R2025a utf8

PROTO SpiderLeg [
  field SFString coxaMotorName "legi_coxa_motor"
  field SFString coxaSensorName "legi_coxa_sensor"
  field SFString femurMotorName "legi_femur_motor"
  field SFString femurSensorName "legi_femur_sensor"
  field SFString tibiaMotorName "legi_tibia_motor"
  field SFString tibiaSensorName "legi_tibia_sensor"
  field SFRotation rotation 0 0 1 0
  field SFVec3f translation 0 0 0
  field SFFloat jointTorque 2.5
  field SFFloat linkMass 0.1
] {
  Transform {
    translation IS translation
    rotation IS rotation
    children [
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          position 0
          minStop -1.570796
          maxStop 1.570796
        }
        device [
          RotationalMotor { name IS coxaMotorName maxTorque IS jointTorque }
          PositionSensor { name IS coxaSensorName }
        ]
        endPoint Solid {
          name IS coxaMotorName
          children [
            Transform {
              translation 0 0.0075 0.0075
              rotation 0 1 0 1.570796
              scale 0.001 0.001 0.001
              children [
                Shape {
                  appearance PBRAppearance { baseColor 0.25 0.27 0.32 }
                  geometry Mesh { url [ "../assets/leg_coxa.stl" ] }
                }
              ]
            }
            HingeJoint {
              jointParameters HingeJointParameters {
                axis 0 0 1
                anchor 0.0438 0 0
                position 0.488692
                minStop -1.570796
                maxStop 1.570796
              }
              device [
                RotationalMotor { name IS femurMotorName maxTorque IS jointTorque }
                PositionSensor { name IS femurSensorName }
              ]
              endPoint Solid {
                name IS femurMotorName
                translation 0.0438 0 0
                rotation 0 0 1 0.488692
                children [
                  Transform {
                    translation 0.044 0 -0.01414
                    scale 0.001 0.001 0.001
                    children [
                      Shape {
                        appearance PBRAppearance { baseColor 0.3 0.32 0.38 }
                        geometry Mesh { url [ "../assets/leg_femur.stl" ] }
                      }
                    ]
                  }
                  HingeJoint {
                    jointParameters HingeJointParameters {
                      axis 0 0 -1
                      anchor 0.088 0 0
                      position 2.007129
                      minStop 0
                      maxStop 2.268928
                    }
                    device [
                      RotationalMotor { name IS tibiaMotorName maxTorque IS jointTorque }
                      PositionSensor { name IS tibiaSensorName }
                    ]
                    endPoint Solid {
                      name IS tibiaMotorName
                      translation 0.088 0 0
                      rotation 0 0 -1 2.007129
                      children [
                        Transform {
                          translation 0.055 0 -0.0175
                          rotation 0 0 1 1.570796
                          scale 0.001 0.001 0.001
                          children [
                            Shape {
                              appearance PBRAppearance { baseColor 0.35 0.37 0.44 }
                              geometry Mesh { url [ "../assets/leg_tibia.stl" ] }
                            }
                          ]
                        }
                      ]
                      boundingObject Transform {
                        translation 0.083 0 0
                        rotation 0 1 0 1.570796
                        children [ Capsule { height 0.148 radius 0.009 } ]
                      }
                      contactMaterial "spider_foot"
                      physics Physics { density -1 mass IS linkMass }
                    }
                  }
                ]
                boundingObject Transform {
                  translation 0.044 0 0
                  rotation 0 1 0 1.570796
                  children [ Capsule { height 0.068 radius 0.01 } ]
                }
                physics Physics { density -1 mass IS linkMass }
              }
            }
          ]
          boundingObject Transform {
            translation 0.0219 0 0
            rotation 0 1 0 1.570796
            children [ Capsule { height 0.0198 radius 0.012 } ]
          }
          physics Physics { density -1 mass IS linkMass }
        }
      }
    ]
  }
}
